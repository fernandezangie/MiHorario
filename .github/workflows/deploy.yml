name: CI/CD Railway

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - instalar y compilar
        working-directory: mi-horario-backend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Frontend - instalar y compilar
        working-directory: mi-horario-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://mihorario-production-944f.up.railway.app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar backend
        run: railway up --ci --service MiHorario

      - name: Desplegar frontend
        run: railway up --ci --service Frontend