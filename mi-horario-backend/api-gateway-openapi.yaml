openapi: 3.0.3
info:
  title: MiHorario Comfama - API Gateway & Security Contract
  version: 1.0.0
  description: >
    Especificación OpenAPI 3.0 del API Gateway de MiHorario (ADR-0001, ADR-0006, ADR-0009).
    Define las políticas de Rate Limiting, autenticación Bearer JWT, control de acceso RBAC
    (ADMIN vs EMPLOYEE) y endpoints de negocio y observabilidad.
servers:
  - url: http://localhost:3000
    description: Entorno de Desarrollo Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      tags: [Observability]
      summary: Liveness & Readiness Probe para Balanceadores de Carga
      responses:
        '200':
          description: Servicio activo y Building Blocks verificados
  /auth/login:
    post:
      tags: [Security & Identity]
      summary: Emisión de Token JWT (Supervisor / Empleado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: daniela.gomez@comfama.com
                password:
                  type: string
                  example: Comfama2026*
                role:
                  type: string
                  enum: [ADMIN, EMPLOYEE]
      responses:
        '201':
          description: Token JWT firmado con HS256 y datos del perfil
  /auth/me:
    get:
      tags: [Security & Identity]
      summary: Verifica el JWT activo y retorna la sesión del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad verificada
  /employees:
    get:
      tags: [Employees]
      summary: Obtiene el listado de colaboradores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de colaboradores
    post:
      tags: [Employees]
      summary: Crea un nuevo colaborador (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Colaborador registrado
  /shifts:
    post:
      tags: [Shifts]
      summary: Asigna un turno a un colaborador (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Turno asignado sin solapamiento
  /zones:
    get:
      tags: [Zones]
      summary: Lista las sedes y zonas físicas de Comfama
      responses:
        '200':
          description: Lista de sedes
    post:
      tags: [Zones]
      summary: Registra una sede o zona física (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Zona creada
  /audit-logs:
    get:
      tags: [Audit Trail - Habeas Data]
      summary: Bitácora inmutable de operaciones de escritura (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial de auditoría

