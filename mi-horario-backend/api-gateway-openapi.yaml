openapi: 3.0.3
info:
  title: MiHorario Comfama - API Gateway & Security Contract
  version: 1.0.0
  description: >
    Especificación OpenAPI 3.0 del API Gateway perimetral (ADR-0001, ADR-0006, ADR-0009).
    Nginx opera como Reverse Proxy en el puerto 443 gestionando la terminación SSL/TLS y
    políticas perimetrales de Rate Limiting. El backend NestJS aplica la autenticación
    Bearer JWT, control de acceso RBAC (ADMIN vs EMPLOYEE) y auditoría inmutable.
servers:
  - url: https://localhost
    description: API Gateway Perimetral Local (Nginx con TLS/HTTPS)
  - url: https://api.mihorario.local
    description: Entorno Staging / Producción con TLS (Nginx Reverse Proxy)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de acceso JWT firmado con HS256 emitido por /auth/login.
        Debe enviarse en la cabecera 'Authorization: Bearer <token>'.

  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        error:
          type: string
          example: Bearer token is missing or invalid
        timestamp:
          type: string
          format: date-time
          example: '2026-11-04T22:30:00.000Z'
        path:
          type: string
          example: /employees

  responses:
    UnauthorizedError:
      description: '401 Unauthorized: Token JWT ausente, expirado o con firma inválida.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: '403 Forbidden: El usuario no cuenta con privilegios suficientes (Requiere rol ADMIN).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: '429 Too Many Requests: Límite de peticiones excedido (Rate Limiting perimetral).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      tags: [Observability]
      summary: Liveness & Readiness Probe para Balanceadores de Carga
      description: Endpoint público expuesto para monitorización continua y verificación de building blocks.
      responses:
        '200':
          description: Servicio activo y dependencias (BD, Redis) operacionales
        '503':
          description: Servicio degradado o dependencias no disponibles

  /auth/login:
    post:
      tags: [Security & Identity]
      summary: Emisión de Token JWT (Supervisor / Empleado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: daniela.gomez@comfama.com
                password:
                  type: string
                  example: Comfama2026*
                role:
                  type: string
                  enum: [ADMIN, EMPLOYEE]
      responses:
        '201':
          description: Token JWT emitido exitosamente junto con la identidad del usuario
        '400':
          description: Credenciales incompletas o formato inválido
        '401':
          description: Credenciales incorrectas
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/me:
    get:
      tags: [Security & Identity]
      summary: Verifica el JWT activo y retorna la sesión del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad verificada exitosamente
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /employees:
    get:
      tags: [Employees]
      summary: Obtiene el listado de colaboradores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de colaboradores
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Employees]
      summary: Crea un nuevo colaborador (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Colaborador registrado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /shifts:
    post:
      tags: [Shifts]
      summary: Asigna un turno a un colaborador (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Turno asignado sin solapamiento
        '400':
          description: Error de solapamiento horario o reglas de jornada laboral
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /zones:
    get:
      tags: [Zones]
      summary: Lista las sedes y zonas físicas de Comfama
      responses:
        '200':
          description: Lista de sedes y zonas
    post:
      tags: [Zones]
      summary: Registra una sede o zona física (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Zona creada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /audit-logs:
    get:
      tags: [Audit Trail - Habeas Data]
      summary: Bitácora inmutable de operaciones de escritura (Exclusivo rol ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial de auditoría
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'