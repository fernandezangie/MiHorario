name: mi_horario_app

services:
  app:
    build:
      context: ./mi-horario-backend
      dockerfile: Dockerfile
    container_name: mihorario_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mihorario-22313.jxf.gcp-us-east1.cockroachlabs.cloud
      - DB_PORT=26257
      - DB_USER=angie.amaya0880
      - DB_NAME=defaultdb
      - DB_SSL=true
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=macromodern-vigorous-trick-24402.db.redis.io
      - REDIS_PORT=11729
      - REDIS_USER=default
      - REDIS_TLS=false
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    restart: unless-stopped

  frontend:
    build:
      context: ./mi-horario-frontend
      dockerfile: Dockerfile
    container_name: mihorario_frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

secrets:
  db_password:
    file: ./mi-horario-backend/secrets/db_password.txt
  redis_password:
    file: ./mi-horario-backend/secrets/redis_password.txt
  jwt_secret:
    file: ./mi-horario-backend/secrets/jwt_secret.txt
