name: mi_horario_app

services:
  postgres:
    image: postgres:16-alpine
    container_name: mihorario_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mi_horario_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mihorario_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: ./mi-horario-backend
      dockerfile: Dockerfile
    container_name: mihorario_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mi_horario_db}
      DB_SSL: "false"
      DB_SYNC: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: default
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 465
      MAIL_USER: jrodriguezgiraldo8@gmail.com
      MAIL_PASS: /run/secrets/mail_password
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./mi-horario-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: mihorario_frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - app

volumes:
  postgres_data:
