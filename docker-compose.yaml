version: '3.8'

name: mi_horario_app

services:
  # 1. Base de datos CockroachDB (Local)
  cockroach:
    image: cockroachdb/cockroach:latest-v23.1
    container_name: mihorario_cockroach
    restart: always
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    command: start-single-node --insecure

  # 2. Caché con Redis (Local)
  redis:
    image: redis:alpine
    container_name: mihorario_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Aplicación (Backend / API)
  app:
    build:
      context: ./mi-horario-backend
      dockerfile: Dockerfile
    container_name: mihorario_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mihorario-22313.jxf.gcp-us-east1.cockroachlabs.cloud
      - DB_PORT=26257
      - DB_USER=angie.amaya0880
      - DB_NAME=defaultdb
      - DB_SSL=true
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=macromodern-vigorous-trick-24402.db.redis.io
      - REDIS_PORT=11729
      - REDIS_USER=default
      - REDIS_TLS=false
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=465
      - MAIL_USER=jrodriguezgiraldo8@gmail.com
      - MAIL_PASS_FILE=/run/secrets/mail_password
    secrets:
      - db_password
      - redis_password
      - jwt_secret
      - mail_password
      - mi_horario_app_jwt_secret
    depends_on:
      - cockroach
      - redis
    restart: unless-stopped

  # 4. Frontend
  frontend:
    build:
      context: ./mi-horario-frontend
      dockerfile: Dockerfile
    container_name: mihorario_frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

# Declaración de volúmenes para persistencia
volumes:
  cockroach_data:

# Declaración de secretos
secrets:
  db_password:
    file: ./mi-horario-backend/secrets/db_password.txt
  redis_password:
    file: ./mi-horario-backend/secrets/redis_password.txt
  jwt_secret:
    file: ./mi-horario-backend/secrets/jwt_secret.txt
  mail_password:
    file: ./mi-horario-backend/secrets/mail_password.txt
  mi_horario_app_jwt_secret:
    file: ./jwt_secret.txt