name: mi_horario_app

services:
  app:
    build:
      context: ./mi-horario-backend
      dockerfile: Dockerfile
    container_name: mihorario_api
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mihorario-22313.jxf.gcp-us-east1.cockroachlabs.cloud
      - DB_PORT=26257
      - DB_USER=angie.amaya0880
      - DB_NAME=defaultdb
      - DB_SSL=true
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=macromodern-vigorous-trick-24402.db.redis.io
      - REDIS_PORT=11729
      - REDIS_USER=default
      - REDIS_TLS=false
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=465
      - MAIL_USER=jrodriguezgiraldo8@gmail.com
      - MAIL_PASS_FILE=/run/secrets/mail_password
    secrets:
      - db_password
      - redis_password
      - jwt_secret
      - mail_password
    restart: unless-stopped

  frontend:
    build:
      context: ./mi-horario-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: mihorario_frontend
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mihorario_nginx
    ports:
      - "80:80" # Expone el puerto HTTP estándar al exterior
      - "443:443" # Expone el puerto HTTPS (para cuando agregues certificados)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

secrets:
  db_password:
    file: ./mi-horario-backend/secrets/db_password.txt
  redis_password:
    file: ./mi-horario-backend/secrets/redis_password.txt
  jwt_secret:
    file: ./mi-horario-backend/secrets/jwt_secret.txt
  mail_password:
    file: ./mi-horario-backend/secrets/mail_password.txt
