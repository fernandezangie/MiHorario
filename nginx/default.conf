# Rate Limiting: 10MB de memoria (~160.000 IPs), 10 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 1. Redirección HTTP -> HTTPS (Zero Trust y transporte cifrado)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# 2. API Gateway / Reverse Proxy HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Ocultar la versión exacta de Nginx por seguridad (OWASP A05)
    server_tokens off;

    # Cabeceras de seguridad perimetral (OWASP A05)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # A. Health Check directo del API (Observabilidad)
    location = /health {
        proxy_pass http://app:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # B. Tráfico del Backend / API (Con Rate Limiting perimetral)
    location /api {
        # Ráfaga permitida de 10 peticiones inmediatas antes de rechazar con 429
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # C. Tráfico hacia el Frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}